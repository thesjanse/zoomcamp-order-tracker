# Single-binary Tempo (-target=all), local block storage. The collector sends
# OTLP traces here; the metrics-generator turns those spans into Prometheus
# span metrics and a service graph, remote-written to Prometheus.
#
# Adapted from example/docker-compose/single-binary/tempo.yaml in grafana/tempo
# v3.1.0. Storage lives under /var/tempo, which the image ships owned by
# UID 10001 so the named volume inherits that ownership.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]

usage_report:
  reporting_enabled: false