apiVersion: 1

providers:
  - name: order-tracker
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    # The dashboards directory is bind-mounted read-only.
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false