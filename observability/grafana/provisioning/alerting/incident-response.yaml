# Webhook target for the incident-response service in incident-response/.
#
# Two things are needed, not one. A contact point alone is not enough: Grafana's
# default notification policy tree points at a receiver named "empty", because with
# no contact points provisioned there is nothing to notify. So the policy below
# has to be provisioned as well, otherwise a firing alert is still silent.
#
# The URL is host.docker.internal because this service runs on the host, not in
# Compose, so that it can start the coding assistant with your own credentials.
# That name only resolves inside a container because the grafana service declares
# extra_hosts host.docker.internal:host-gateway. Grafana does not expand environment
# variables in provisioning files, so if you run the responder somewhere else, edit
# the url below and `docker compose restart grafana`.
#
# Editing this file needs `docker compose restart grafana` to take effect.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-response
    receivers:
      - uid: incident-response-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          # This is the host's address as seen from inside a container, not a port
          # on the compose network. See the extra_hosts entry in compose.yaml.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-response
    group_by:
      - grafana_folder
      - alertname
    # The responder dedupes repeat notifications per alert fingerprint, so the
    # group timings here are only about not flooding it in the first place.
    group_wait: 15s
    group_interval: 5m
    repeat_interval: 4h